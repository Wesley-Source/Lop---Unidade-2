<script>
  // ============================================================
  // CONTROLE POR CABEÇA (DIREÇÃO) E MÃOS (ACELERAÇÃO/RÉ)
  // ============================================================
  let headSteering = 0;
  let leftHandThrottle = 0;
  let rightHandReverse = 0;
  let netThrottle = 0;
  let poseActive = false;
  
  let smoothSteering = 0;
  let smoothNetThrottle = 0;
  const STEERING_SMOOTH = 0.28;
  const THROTTLE_SMOOTH = 0.32;
  
  const velElement = document.getElementById('velocidade');
  const scoreElement = document.getElementById('score');
  const poseStatusDiv = document.getElementById('poseStatus');
  
  let totalCollected = 0;
  let cubesList = [];
  const MAX_CUBES = 6;
  
  const BOUNDS = {
    xMin: -12.2,
    xMax: 12.2,
    zMin: -12.0,
    zMax: 12.0
  };
  
  let carEntity = null;
  let currentSpeed = 0;
  const MAX_SPEED = 12.0;
  const ACC_FORCE = 11.0;
  const BRAKE_FORCE = 9.0;
  const TURN_FORCE = 2.6;
  const FRICTION = 0.965;
  
  // --------------------------------------------------------------
  // CUBOS COLETÁVEIS
  // --------------------------------------------------------------
  function spawnRandomCube() {
    if (!carEntity) return null;
    const group = document.getElementById('collectibles-group');
    if (!group) return null;
    
    let posX, posZ, safe = false;
    let attempts = 0;
    while (!safe && attempts < 40) {
      posX = (Math.random() - 0.5) * 22;
      posZ = (Math.random() - 0.5) * 22;
      const carPos = carEntity.object3D.position;
      const dx = carPos.x - posX;
      const dz = carPos.z - posZ;
      if (Math.hypot(dx, dz) > 2.2 && Math.abs(posX) < 12 && Math.abs(posZ) < 12) {
        safe = true;
      }
      attempts++;
    }
    const hue = Math.floor(Math.random() * 360);
    const sat = 35 + Math.floor(Math.random() * 35);
    const light = 55 + Math.floor(Math.random() * 25);
    const cubeColor = `hsl(${hue}, ${sat}%, ${light}%)`;
    const cube = document.createElement('a-box');
    cube.setAttribute('color', cubeColor);
    cube.setAttribute('width', '0.9');
    cube.setAttribute('height', '0.9');
    cube.setAttribute('depth', '0.9');
    cube.setAttribute('position', `${posX} 0.45 ${posZ}`);
    cube.setAttribute('class', 'collectible');
    cube.setAttribute('material', 'metalness: 0.1; roughness: 0.5');
    cube.setAttribute('animation', `property: position; dir: alternate; dur: 1400; loop: true; to: ${posX} 0.85 ${posZ}; easing: ease-in-out`);
    group.appendChild(cube);
    return { entity: cube, position: { x: posX, z: posZ }, active: true };
  }
  
  function initCollectibles() {
    const group = document.getElementById('collectibles-group');
    if (!group) return;
    while (group.firstChild) group.removeChild(group.firstChild);
    cubesList = [];
    for (let i = 0; i < MAX_CUBES; i++) {
      const newCube = spawnRandomCube();
      if (newCube) cubesList.push(newCube);
    }
    totalCollected = 0;
    scoreElement.innerText = totalCollected;
  }
  
  function collectCube(cubeObj) {
    if (!cubeObj.active) return false;
    cubeObj.active = false;
    cubeObj.entity.parentNode.removeChild(cubeObj.entity);
    totalCollected++;
    scoreElement.innerText = totalCollected;
    const index = cubesList.indexOf(cubeObj);
    if (index !== -1) cubesList.splice(index, 1);
    const newCube = spawnRandomCube();
    if (newCube) cubesList.push(newCube);
    scoreElement.style.opacity = '0.7';
    setTimeout(() => { if(scoreElement) scoreElement.style.opacity = '1'; }, 120);
    return true;
  }
  
  function checkCollectiblesCollision(carX, carZ) {
    for (let i = 0; i < cubesList.length; i++) {
      const c = cubesList[i];
      if (!c.active) continue;
      const dx = carX - c.position.x;
      const dz = carZ - c.position.z;
      if (Math.hypot(dx, dz) < 1.0) {
        collectCube(c);
      }
    }
  }
  
  function applyWallCollision(x, z) {
    let newX = x, newZ = z;
    let collided = false;
    if (newX < BOUNDS.xMin) { newX = BOUNDS.xMin; collided = true; }
    if (newX > BOUNDS.xMax) { newX = BOUNDS.xMax; collided = true; }
    if (newZ < BOUNDS.zMin) { newZ = BOUNDS.zMin; collided = true; }
    if (newZ > BOUNDS.zMax) { newZ = BOUNDS.zMax; collided = true; }
    if (collided) currentSpeed *= 0.75;
    return { x: newX, z: newZ };
  }
  
  // --------------------------------------------------------------
  // COMPONENTE A-FRAME (CONTROLE DO CARRO)
  // --------------------------------------------------------------
  AFRAME.registerComponent('car-motion-control', {
    init: function() {
      this.velocity = 0;
      this.el = this.el;
      carEntity = this.el;
    },
    tick: function(time, delta) {
      if (!carEntity) return;
      let dt = Math.min(delta / 1000, 0.033);
      if (dt <= 0) return;
      
      let targetThrottle = smoothNetThrottle;
      let targetSteer = smoothSteering;
      
      if (!poseActive) {
        targetThrottle = 0;
        targetSteer = 0;
      }
      
      if (targetThrottle > 0) {
        this.velocity += ACC_FORCE * targetThrottle * dt;
      } else if (targetThrottle < 0) {
        this.velocity += BRAKE_FORCE * targetThrottle * dt;
      }
      
      this.velocity *= Math.pow(FRICTION, dt * 60);
      if (Math.abs(this.velocity) < 0.05) this.velocity = 0;
      this.velocity = Math.min(MAX_SPEED, Math.max(-MAX_SPEED * 0.7, this.velocity));
      currentSpeed = this.velocity;
      
      let speedKmh = Math.abs(this.velocity * 8.2).toFixed(0);
      velElement.innerText = speedKmh;
      
      let turnAngle = targetSteer * TURN_FORCE * (Math.min(Math.abs(this.velocity) / 6.5, 1.2)) * dt;
      if (Math.abs(this.velocity) < 0.4) turnAngle *= 0.6;
      let newRotation = carEntity.object3D.rotation.y + turnAngle;
      carEntity.object3D.rotation.y = newRotation;
      
      let forward = this.velocity * dt;
      let angle = carEntity.object3D.rotation.y;
      let deltaX = -Math.sin(angle) * forward;
      let deltaZ = -Math.cos(angle) * forward;
      
      let currentPos = carEntity.object3D.position;
      let newX = currentPos.x + deltaX;
      let newZ = currentPos.z + deltaZ;
      
      let collisionResult = applyWallCollision(newX, newZ);
      carEntity.object3D.position.x = collisionResult.x;
      carEntity.object3D.position.z = collisionResult.z;
      
      checkCollectiblesCollision(collisionResult.x, collisionResult.z);
    }
  });
  
  document.addEventListener('DOMContentLoaded', () => {
    const car = document.getElementById('car');
    if (car && !car.hasAttribute('car-motion-control')) {
      car.setAttribute('car-motion-control', '');
    }
    initCollectibles();
  });
  
  // --------------------------------------------------------------
  // MEDIAPIPE POSE + DESENHO COM ESPELHAMENTO CORRETO (SEM INVERSÃO Y)
  // --------------------------------------------------------------
  const videoElement = document.getElementById('webcam-video');
  const canvasElement = document.getElementById('pose-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  
  let pose = null;
  let camera = null;
  
  function computeHeadSteering(noseX, leftShoulderX, rightShoulderX) {
    if (!leftShoulderX || !rightShoulderX) return 0;
    let centerX = (leftShoulderX + rightShoulderX) / 2;
    let shoulderSpan = Math.abs(rightShoulderX - leftShoulderX);
    if (shoulderSpan < 0.05) return 0;
    let raw = (noseX - centerX) / (shoulderSpan * 0.7);
    return Math.min(0.95, Math.max(-0.95, raw));
  }
  
  function computeLeftThrottle(leftWristY, leftShoulderY) {
    if (!leftShoulderY) return 0;
    let diff = leftShoulderY - leftWristY;
    if (diff <= 0) return 0;
    let factor = Math.min(1.0, diff * 3.2);
    return factor;
  }
  
  function computeRightReverse(rightWristY, rightShoulderY) {
    if (!rightShoulderY) return 0;
    let diff = rightShoulderY - rightWristY;
    if (diff <= 0) return 0;
    let factor = Math.min(0.9, diff * 3.2);
    return factor;
  }
  
  function onPoseResults(results) {
    if (!results.poseLandmarks || results.poseLandmarks.length === 0) {
      if (poseActive) {
        poseActive = false;
        poseStatusDiv.innerText = "SINAL PERDIDO / AUSENTE";
      }
      return;
    }
    
    poseActive = true;
    poseStatusDiv.innerText = "CONTROLE ATIVO | CABECA + MAOS";
    
    const lm = results.poseLandmarks;
    const nose = lm[0];
    const leftShoulder = lm[11];
    const rightShoulder = lm[12];
    const leftWrist = lm[15];
    const rightWrist = lm[16];
    
    if (!nose || !leftShoulder || !rightShoulder || !leftWrist || !rightWrist) {
      return;
    }
    
    let rawSteer = computeHeadSteering(nose.x, leftShoulder.x, rightShoulder.x);
    let rawForward = computeLeftThrottle(leftWrist.y, leftShoulder.y);
    let rawReverse = computeRightReverse(rightWrist.y, rightShoulder.y);
    
    let combinedThrottle = rawForward - rawReverse;
    combinedThrottle = Math.min(1.0, Math.max(-0.9, combinedThrottle));
    
    smoothSteering = smoothSteering * (1 - STEERING_SMOOTH) + rawSteer * STEERING_SMOOTH;
    smoothNetThrottle = smoothNetThrottle * (1 - THROTTLE_SMOOTH) + combinedThrottle * THROTTLE_SMOOTH;
    
    // ========== DESENHO NO CANVAS (SEM INVERSÃO DE EIXO Y) ==========
    const w = canvasElement.width;
    const h = canvasElement.height;
    canvasCtx.clearRect(0, 0, w, h);
    
    // Espelhar horizontalmente o vídeo (selfie view) e desenhar
    canvasCtx.save();
    canvasCtx.translate(w, 0);
    canvasCtx.scale(-1, 1);
    canvasCtx.drawImage(videoElement, 0, 0, w, h);
    
    // Desenhar pontos dos landmarks (já espelhados pela transformação)
    const drawPoint = (lm, color) => {
      if (!lm) return;
      const x = lm.x * w;
      const y = lm.y * h;
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 4, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
      canvasCtx.strokeStyle = "#fff";
      canvasCtx.lineWidth = 1;
      canvasCtx.stroke();
    };
    
    drawPoint(leftWrist, "#aa8888");
    drawPoint(rightWrist, "#88aacc");
    drawPoint(leftShoulder, "#777");
    drawPoint(rightShoulder, "#777");
    drawPoint(nose, "#ccc");
    
    canvasCtx.restore(); // restaura para desenhar UI sem espelhamento
    
    // Linha vertical central (referência)
    const centerX = w / 2;
    canvasCtx.beginPath();
    canvasCtx.moveTo(centerX, 0);
    canvasCtx.lineTo(centerX, h);
    canvasCtx.strokeStyle = "#aaa";
    canvasCtx.lineWidth = 1.2;
    canvasCtx.setLineDash([6, 8]);
    canvasCtx.stroke();
    canvasCtx.setLineDash([]);
    
    // Barras de intensidade (aceleração e ré)
    const barWidth = 40;
    const barHeight = 60;
    const barXLeft = 8;
    const barXRight = w - barWidth - 8;
    const barY = h - barHeight - 8;
    
    canvasCtx.fillStyle = "#222";
    canvasCtx.fillRect(barXLeft, barY, barWidth, barHeight);
    const forwardHeight = rawForward * barHeight;
    canvasCtx.fillStyle = "#aaa";
    canvasCtx.fillRect(barXLeft, barY + barHeight - forwardHeight, barWidth, forwardHeight);
    canvasCtx.fillStyle = "#ddd";
    canvasCtx.font = "bold 9px monospace";
    canvasCtx.fillText("ACEL", barXLeft+2, barY-2);
    
    canvasCtx.fillStyle = "#222";
    canvasCtx.fillRect(barXRight, barY, barWidth, barHeight);
    const reverseHeight = rawReverse * barHeight;
    canvasCtx.fillStyle = "#aaa";
    canvasCtx.fillRect(barXRight, barY + barHeight - reverseHeight, barWidth, reverseHeight);
    canvasCtx.fillStyle = "#ddd";
    canvasCtx.fillText("RE", barXRight+12, barY-2);
    
    // Indicador de direção (triângulo móvel)
    const steerIndicatorX = centerX + (rawSteer * (w / 2.5));
    canvasCtx.beginPath();
    canvasCtx.moveTo(steerIndicatorX - 6, 12);
    canvasCtx.lineTo(steerIndicatorX, 4);
    canvasCtx.lineTo(steerIndicatorX + 6, 12);
    canvasCtx.fillStyle = "#ccc";
    canvasCtx.fill();
    canvasCtx.fillStyle = "#fff";
    canvasCtx.font = "8px monospace";
    canvasCtx.fillText("DIRECAO", centerX-20, 18);
  }
  
  function initMediaPipe() {
    pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    pose.onResults(onPoseResults);
    
    camera = new Camera(videoElement, {
      onFrame: async () => {
        if (pose) await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start().then(() => {
      poseStatusDiv.innerText = "CAMERA OK | MOVIMENTE CABECA E MAOS";
    }).catch(err => {
      console.error("Camera error", err);
      poseStatusDiv.innerText = "ERRO: SEM ACESSO A CAMERA";
      poseActive = false;
    });
  }
  
  function resizeCanvas() {
    const container = document.getElementById('webcam-container');
    if (container) {
      const w = container.clientWidth;
      const h = container.clientHeight;
      canvasElement.width = w;
      canvasElement.height = h;
      canvasElement.style.width = `${w}px`;
      canvasElement.style.height = `${h}px`;
    }
  }
  
  window.addEventListener('load', () => {
    resizeCanvas();
    initMediaPipe();
    window.addEventListener('resize', resizeCanvas);
  });
  
  setInterval(() => {
    if (cubesList.length < MAX_CUBES && document.getElementById('collectibles-group')) {
      while(cubesList.length < MAX_CUBES) {
        const newC = spawnRandomCube();
        if(newC) cubesList.push(newC);
      }
    }
  }, 6000);
</script>
